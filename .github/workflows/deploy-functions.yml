name: Deploy Appwrite functions

on:
  push:
    branches: [main]
    paths:
      - functions/**
      - appwrite.config.json
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appwrite-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      APPWRITE_WYKOP_INDEX_FUNCTION_ID: ${{ vars.APPWRITE_WYKOP_INDEX_FUNCTION_ID }}
      APPWRITE_WYKOP_POST_FUNCTION_ID: ${{ vars.APPWRITE_WYKOP_POST_FUNCTION_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test functions before deployment
        run: node --test functions/test/*.test.mjs
      - name: Check function entrypoints
        run: |
          node --check functions/wykop-index/src/main.js
          node --check functions/wykop-post/src/main.js
      - name: Package the configured OpenRouter fallback model
        env:
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { resolveOpenRouterModel } from './functions/wykop-index/src/ai-provider.js';
          const model = resolveOpenRouterModel();
          await writeFile('functions/wykop-index/src/deployment-model.js', `export default ${JSON.stringify(model)};\n`);
          console.log(`Deploying Gemini-first sentiment analysis with OpenRouter fallback model ${model}; mentions and Tomek videos use Gemini`);
          NODE
      - name: Install Appwrite CLI
        run: npm install --global appwrite-cli@28.13.3
      - name: Configure Appwrite deployment credentials
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          : "${APPWRITE_ENDPOINT:?Set the APPWRITE_ENDPOINT repository variable}"
          : "${APPWRITE_PROJECT_ID:?Set the APPWRITE_PROJECT_ID repository variable}"
          : "${APPWRITE_WYKOP_INDEX_FUNCTION_ID:?Set the APPWRITE_WYKOP_INDEX_FUNCTION_ID repository variable}"
          : "${APPWRITE_WYKOP_POST_FUNCTION_ID:?Set the APPWRITE_WYKOP_POST_FUNCTION_ID repository variable}"
          : "${APPWRITE_API_KEY:?Set the APPWRITE_API_KEY repository secret}"
          appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Deploy and verify active functions
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          set -euo pipefail
          node functions/scripts/deploy-function.mjs "$APPWRITE_WYKOP_INDEX_FUNCTION_ID"
          node functions/scripts/deploy-function.mjs "$APPWRITE_WYKOP_POST_FUNCTION_ID"
