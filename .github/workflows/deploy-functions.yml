name: Deploy Appwrite functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appwrite-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      APPWRITE_WYKOP_INDEX_FUNCTION_ID: ${{ vars.APPWRITE_WYKOP_INDEX_FUNCTION_ID }}
      APPWRITE_WYKOP_POST_FUNCTION_ID: ${{ vars.APPWRITE_WYKOP_POST_FUNCTION_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test functions before deployment
        run: node --test functions/test/*.test.mjs
      - name: Package the configured OpenRouter model for sentiment analysis
        env:
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { resolveOpenRouterModel } from './functions/wykop-index/src/ai-provider.js';
          const model = resolveOpenRouterModel();
          await writeFile('functions/wykop-index/src/deployment-model.js', `export default ${JSON.stringify(model)};\n`);
          console.log(`Deploying wykop-index sentiment analysis with OPENROUTER_MODEL=${model}; mentions and Tomek videos use Gemini`);
          NODE
      - name: Install Appwrite CLI
        run: npm install --global appwrite-cli@28.13.3
      - name: Configure Appwrite deployment credentials
        env:
          APPWRITE_FUNCTIONS_API_KEY: ${{ secrets.APPWRITE_FUNCTIONS_API_KEY }}
        run: |
          : "${APPWRITE_ENDPOINT:?Set the APPWRITE_ENDPOINT repository variable}"
          : "${APPWRITE_PROJECT_ID:?Set the APPWRITE_PROJECT_ID repository variable}"
          : "${APPWRITE_WYKOP_INDEX_FUNCTION_ID:?Set the APPWRITE_WYKOP_INDEX_FUNCTION_ID repository variable}"
          : "${APPWRITE_WYKOP_POST_FUNCTION_ID:?Set the APPWRITE_WYKOP_POST_FUNCTION_ID repository variable}"
          : "${APPWRITE_FUNCTIONS_API_KEY:?Set the APPWRITE_FUNCTIONS_API_KEY repository secret}"
          appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_FUNCTIONS_API_KEY"
      - name: Deploy and activate both functions
        run: |
          appwrite push functions --function-id "$APPWRITE_WYKOP_INDEX_FUNCTION_ID" --force --activate=true
          appwrite push functions --function-id "$APPWRITE_WYKOP_POST_FUNCTION_ID" --force --activate=true
